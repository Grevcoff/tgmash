# Render.com конфигурация
services:
  - type: web
    name: mushroom-bot-api
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mushroom-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://your-app.vercel.app
      - key: PORT
        value: 8000

databases:
  - name: mushroom-db
    plan: free
    databaseName: mushroom
    user: mushroom_user
